<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AnimalGuide</title>
</head>
<body>
<h1>AnimalGuide</h1>
<p>Каркас собран. Механизмы:</p>
<ul id="mechanisms"></ul>
<script>
fetch('/api/features').then(r => r.json()).then(d => {
  const ul = document.getElementById('mechanisms');
  for (const m of d.mechanisms) {
    const li = document.createElement('li');
    li.textContent = (m.on ? '● ' : '○ ') + m.title + ' (' + m.name + ')';
    ul.appendChild(li);
  }
});
</script>
</body>
</html>
